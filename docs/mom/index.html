 העניין. מובהר, כי רק אדם שיזוהה במערכות MAX כמי שהינו בעל כרטיס/ים ו/או כמי שמוסמך לקבל את השירותים עבור בית העסק, יהיה רשאי לבצע פעולות באמצעות השירותים.\r\n4.              חברת MAX שומרת לעצמה את הזכות להוסיף ו/או לגרוע בעתיד שירותים שונים בהתאם לשיקול דעתה הבלעדי. כמו כן, חברת MAX שומרת לעצמה את הזכות שלא לספק שירותים מסוימים עבור סוגי כרטיסים מסוימים (כגון כרטיסים שנחסמו ו/או בוטלו מכל סיבה שהיא) ו/או סוגי חשבונות סליקה מסוימים והכל בכפוף לשיקול דעתה.\r\n5.              מובהר, כי הפרסום שיופיע בשירותים מעת לעת, ככל שיופיע, אינו מהווה הצעה ו/או ייעוץ וייתכן ואינו מתחשב בנתונים המיוחדים שלך, ואין בו משום המלצה ו/או חוות דעת ו/או תחליף לשיקול דעתך העצמאי.\r\n6.              בשירותים עשויים להופיע פרסומים הכוללים ביקורת על אישים ו/או מוצרים ו/או שירותים שונים ו/או אירועים שונים, שאינם בהכרח משקפים את דעת MAX, אלא את דעותיו האישיות של הכותב בלבד.\r\n7.              השירותים עשויים לאפשר העברה ו/או פרסום מסרים על ידי משתמשים שונים. מסרים אלה הינם באחריותם הבלעדית של שולחיהם ו-MAX לא תישא בכל אחריות בגינם.\r\n8.              ככל שהשירותים ו/או המוצרים המוצעים מסופקים לך על-ידי צד שלישי כלשהו, הצד השלישי יהיה האחראי הבלעדי לכל המוצרים ו/או השירותים שיסופקו על-ידיו.\r\n9.              במהלך השימוש בשירותים באמצעות האפליקציות, תשלחנה לך הודעות והתראות שונות מהאפליקציות, הכוללות מידע בקשר לתשלומים ועסקאות שתבצע באמצעותן. בשימושך בשירותים אלה, הנך מאשר קבלת הודעות והתראות אלו.\r\nביכולתך לחסום קבלת הודעות והתראות מהאפליקציות באמצעות מסך ההגדרות של מכשירך.\r\n\r\nג. התחייבויותיך בעת השימוש בשירותים\r\n \r\n\r\nהנך מתחייב לא לבצע את הפעולות הבאות (כולן או חלקן):\r\n\r\n10.          התחזות לכל אדם או ישות משפטית אחרת המשתמש בשירותים.\r\n11.          הטענה, שליחה או שידור של כל חומר המכיל כל סוג של וירוס מחשב, או כל קוד מחשב אחר, המתוכנן להרוס, להפריע, או להגביל את השימוש (ובכלל זה כל שימוש אחר מלבד שימוש הוגן וסביר באתר) בכל אחד מן המחשבים, השרתים, החומרה והתוכנה אשר מצויות בשימוש MAX לצורך אספקת השירותים.\r\n12.          הפצת דואר זבל (spam), או הצפה של כל דואר אחר את השרתים באמצעותם מופעלים השירותים.\r\n13.          שינוי, עיבוד, התאמה, מתן רישיון משנה, תרגום, מכירה, ביצוע פעולות של הנדסה חוזרת, פירוק או הרכבה מחדש של כל אחד מחלקי הקוד המרכיבים את האתר וכן פעולות כנ\"ל לגבי החומרה והתוכנה אשר מצויים בשימוש עבור מתן השירותים.\r\n14.          פגיעה בכל דרך שהיא בזכויות יוצרים, סימני מסחר, או כל זכות קניינית אחרת אשר מצויות בשירותים.\r\n15.          הצבת השירותים, או כל חלק מהם או כל חלק מאתר, בתוך מסגרת של אתר אחר (frame), או כחלק מאתר אחר (mirror), או כחלק משירות אחר ללא קבלת הסכמה מפורשת וכתובה של MAX.\r\n16.          שימוש בכל רובוט, \"תולעת\" (spider), מנוע אחזור וחיפוש מידע, או כל כלי אוטומטי, או ידני אחר אשר מתוכנן לאנדקס, לאחזר, ולאתר מידע בשירותים ו/או באתר, או כלי כאמור אשר מתוכנן לחשוף את מבנה מאגר הנתונים והקוד בשירותים ו/או באתר.\r\n17.          להפריע בכל דרך אחרת, או לקטוע את השירותים ו/או את האתר, ובכלל זה על ידי הפרעה לפעולות השרת, ורשת המחשבים המחוברים לשירותים ו/או האתר או של רשת המחשבים המחוברת אליהן.\r\n18.          להעלות ו/או לשלוח באמצעות השירותים כל חומר ו/או מסר שהינו בלתי חוקי ו/או בלתי מוסרי ו/או פוגעני בכל אופן שהוא ו/או בלתי רלוונטי.\r\n19.          השירותים אותם מציעה חברת MAX מהווים קניינה הרוחני של MAX. הינך מתחייב שלא לעשות כל שימוש בשירותים, אלא בהתאם ועל פי הוראות תנאי שימוש אלה.\r\n20.          מבלי לגרוע מהאמור לעיל, תהיה חברת MAX רשאית להסיר או לערוך מסרים שהועלו על ידיך לשירותים, לפי שיקול דעתה הבלעדי.\r\n21.          הינך מתחייב שלא לעשות כל שימוש שאינו חוקי בשירותים ו/או במכשיר.\r\n22.          מבלי לגרוע מכלליות האמור לעיל, הינך מתחייב שלא לעשות שימוש בשירותים לצורך רכישה ו/או מכירה של אלכוהול ו/או סמים מסוכנים ו/או תרופות ו/או פורנוגרפיה ו/או לצורך ביצוע הימורים ו/או משחקים אסורים (לרבות קבלת כספי ההימורים ו/או המשחקים האסורים) ו/או כל תחום אחר שייאסר על ידי MAX.\r\n23.          כמו כן, הינך מתחייב שלא לעשות כל שימוש בשירותים שיש בו כדי להפר זכויות יוצרים ו/או זכויות קניין רוחני של MAX ו/או של כל גורם שהוא.\r\nד. רישום לשירותים\r\n \r\n\r\n24.          ייתכן וחלק מהשירותים מותנים ברישום קודם. במידה וכך, יחולו לגבי הרישום ההוראות המפורטות להלן.\r\n25.          במהלך הרישום לאיזה מהשירותים ייתכן ותתבקש לבחור בסיסמה אישית אשר תזהה אותך בעת השימוש באילו מהשירותים. כמו כן, במקרים מסוימים, תתבקש לבחור בשאלות מזהות, ולספק את התשובה להן. פעולה זו מאפשרת ביצוע זיהוי טוב יותר של הלקוח ושימוש בטוח יותר בשירותים.\r\n26.          הינך מתבקש לנקוט בכל האמצעים לשמירה על הסיסמה והתשובות לשאלות המזהות בסוד, ולפעול בהתאם להנחיות MAX כפי שתהיינה מעת לעת, לרבות החלפת הסיסמה בסיסמה חדשה אקראית וקשה לניחוש ככל האפשר, בתדירות שתורה לך MAX .MAX לא תישא באחריות במידה ומסרת את הסיסמה לאחר, למעט מסירתה למורשים בהתאם להוראות ההסכם.\r\n27.          בעת הרישום לשירותים (ובפרט לשירות הצפייה בדפי המידע), הינך מאשר לחברת MAX לשמור מידע מסוים אודותיך. השימוש במידע זה ובכל מידע אחר אודותיך יהא כפוף למדיניות הפרטיות של MAX המפורטת להלן.\r\n28.          למען הסר ספק, מובהר בזאת כי כל התנועות והפעולות המבוצעות באמצעות השירותים נרשמות ומתועדות על ידי MAX.\r\n29.          הנך מתחייב לספק מידע אמיתי, מדויק, נכון ומלא אודותיך כפי שמתבקש בטופס הרישום. כן, הנך מתחייב לעדכן את המידע כפי שנמסר בטופס הרישום במטרה לשמור על נכונותו ושלמותו.\r\n30.          חברתMAX שומרת לעצמה את הזכות להשעות, לבטל או לסרב לספק את השירותים, כולם או חלקם, בכל מקרה של אספקת מידע שאינו אמיתי, מעודכן, שלם או נכון בזמן הרישום או לאחריו, או אם יש לחברת MAX את היסוד הסביר להניח כי כך קרה.\r\nה. סעדים\r\n \r\n\r\n31.          חברתMAX תהיה רשאית בכל עת וללא הודעה מוקדמת לעדכן בדבר מידע לא מדויק או שגוי שמסרת לה, להזהיר באופן מיידי את קהל לקוחותיה נגד פעולותיך, להחזיק ולעכב את ביצוע העסקאות ו/או את הכספים שתעביר ולהגביל מקורות כספיים ותשלומים, להגביל את גישתך לשירותים (לרבות וללא הגבלה, ליכולת לבצע העברת כספים ותשלומים) ולסרב לספק לך את השירותים בקרות אחד או יותר מהמקרים הבאים:\r\n31.1       אם קיים חשש שהפרת את הוראות תנאי שימוש אלה.\r\n31.2       אם אין היא מסוגלת לאמת ו/או לתקף מידע שנמסר על ידיך.\r\n31.3       אם היא סבורה שהשימוש שלך בשירותים מהווה סיכון כספי ו/או הונאה כלשהי ו/או אם קיים חשש סביר לכך.\r\n31.4       אם היא סבורה שפעולותיך עלולות לגרום להפסד כספי ו/או תשלום ו/או ליצור אחריות משפטית עבורך, עבורן ו/או עבור קהל לקוחותיהן.\r\n31.5       אם מנפיק הכרטיס שלך, או הבנק בו מתנהל חשבון האשראי שלך סבור, כי השימוש שלך בשירותים לצורך העברת כספים ותשלומים מהווה ניצול לרעה של אמצעי התשלום של מי מהם.\r\n \r\n\r\nו. אחריות וסיכונים\r\n \r\n\r\n32.          מובהר, כי מערכותיה של חברתMAX, מעצם היותן מבוססות על תוכנות, חומרות ורשתות תקשורת, חשופות לסיכונים הטבועים במערכות מסוג זה, לרבות תכנות מפגעות (וירוסים, סוסים טרויאנים וכד'), ציתות לקווי תקשורת, פריצה על-ידי גורמים עוינים, התחזות לאתרי MAX או לאיזה מהמערכות והונאות מקוונות אחרות.חברתMAX משקיעה מאמצים רבים בהגנה מפני סיכונים אלה, אך למרות זאת, אין אפשרות לחסימה מוחלטת וייתכנו נזקים ו/או הפסדים עקב התממשות איזה מהסיכונים, לרבות גילוי ו/או שיבוש מידע המועבר ו/או מוצג במערכות, ובכלל זאת שיבוש בהוראות/בקשות, פעולות לא מורשות בחשבונות, שיבושים בפעולת המערכות ו/או בזמני התגובה שלהן, לרבות אי-ביצוע, ביצוע שגוי ו/או ביצוע באיחור של הוראה/בקשה, חוסר זמינות של המערכות או איזה משירותיהן וכד'.\r\n33.          מובהר, כי השירותים יינתנו על ידי MAX בהתאם להנחיות הלקוח ו/או הנחיותיו של מי שנחזה ללקוח, בכפוף להוראות תנאי השימוש. אשר על כן, כדי להקטין את הסיכון, עליך להקפיד על נהלי אבטחת המידע של MAX. כמו-כן עליך להודיע מיד ל-MAX על כל מקרה של חשש לשימוש לרעה בחשבונך ו/או בכרטיסך ו/או בשמך. במקרה של חשש לחשיפת הסיסמה האישית של MAX יש לבצע החלפת סיסמה באופן יזום ומיידי באתר האינטרנט או בעזרת שירות הלקוחות. הינך מתחייב לשאת באחריות בגין כל הפרה שלך את נהלי אבטחת המידע של MAX.\r\n34.          מבלי לגרוע מכל האמור בהסכם זה, חברתMAX תהיה פטורה מאחריות לנזק, הפסד או הוצאה כלשהם העלולים להיגרם לך, במישרין או בעקיפין, כתוצאה מכל אחד מן האירועים/הגורמים האלה, ובתנאי שאותם גורמים אינם בשליטת MAX, וMAX עשתה מאמץ סביר למנעם:\r\n34.1       שיבוש בנתונים או בהוראות, או אי-ביצוע או ביצוע באיחור של הוראה כתוצאה מתקלות או שיבושים כלשהם בקווי התקשורת ו/או תפקוד אלקטרוני או מכני לקוי, בין אצלך, בין בחברה ובין אצל צד שלישי כלשהו באמצעותו עוברים ההוראות והמידע.\r\n34.2       תפקוד לקוי של כל תכנה ו/או חומרה המצויות אצלך, לרבות כל תכנה ו/או חומרה שסופקה לך על-ידי צד שלישי.\r\n34.3       חשיפה וגילוי מידע על ידיך לצד שלישי כלשהו, כתוצאה משימוש בשירותים (לרבות מוצרים ו/או שירותים של צד שלישי המוצעים לך במהלך השימוש בשירותים) או כתוצאה ממסירת פרטים לא מדויקים ו/או כתוצאה מהעברת מכשירך לאחר, לרבות לצורך תיקון המכשיר, לרבות במקרה שאותו אחר יצפה במידע שיתקבל מ-MAX באמצעות המכשיר או יבצע באמצעותו פעולות שונות במסגרת השירותים, והינך מתחייב לשאת בכל נזק, הפסד או הוצאה שייגרמו לך או לחברה בקשר לכך.\r\n35.          מובהר, כי אין באמור לעיל כדי לגרוע מאחריותך בנוגע למכשירך, לרבות אבטחתו. כמו כן, מובהר, כי פעולות מסוימות שתבצע במכשיר, כגון \"פריצתו\" עשויות לפגוע באבטחת המידע והשירותים וזאת בנוסף להיותן של חלק מפעולות אלה אי חוקיות ואסורות.\r\n \r\n\r\nז. אפליקציות MAX\r\n \r\n\r\n36.          לצורך השימוש באפליקציות של MAX יש להוריד אותן מחנות האפליקציות של חברת Apple ו/או Google ו/או כל חברה אחרת שתאפשר זאת בעתיד.\r\n37.          מובהר, כי חברת Apple ו- Google אינן צד לתנאי שימוש אלה. האחריות לאפליקציות ולתוכן המוצג בהן הינה של חברת MAX בלבד. מובהר, כי במקרה של סתירה בין תנאי השימוש באפליקציות על-פי כתב זה לתנאי השימוש שנקבעו ביני לבין חנות האפליקציות יגבר האמור בתנאי החנות.\r\n38.          רישיון השימוש באפליקציות שמוענק לך הינו רישיון אישי ובלתי ניתן להעברה, לשימוש במכשיר שבבעלותך או בשליטתך ובהתאם לתנאי השימוש שנקבעו ב-Terms of Service של חנות האפליקציות ובתנאי שימוש אלה.\r\n39.          שים לב! בעת התקנת האפליקציות והרישום תידרש לאמת את המכשיר באמצעותו תעשה שימוש באפליקציה. באפשרותך להשתמש באפליקציה אך ורק באמצעות המכשיר באמצעותו הזדהית. אין לאפשר לאף אדם אחר מלבדך להשתמש במכשירך האישי. כמו כן, עליך להקפיד על נעילת המכשיר באמצעות סיסמא שהוגדרה על ידיך, ואשר ידועה לך בלבד, כאשר אינך עושה שימוש במכשיר.\r\nחלקים באפליקציות עשויים לכלול תוכנות קוד פתוח שבבעלות צדדי ג', ואשר כפופות לתנאי צד ג' (להלן: \"תנאים של צדדים שלישיים\"). רשימה של תוכנות קוד מקור פתוח של צדדים שלישיים ותנאים קשורים של צדדים שלישיים מפורסמת בכתובת:\r\n\r\nhttps://www.max.co.il/api/umbraco/getImage?imageName=MAX-Open-Source.pdf\r\n\r\nאם יש סתירה בין התנאים של צדדים שלישיים ותנאי הסכם זה, התנאים של צדדים שלישיים יגברו, אולם אך ורק בנוגע לתוכנות קוד פתוח של צדדי ג' הרלוונטיים.\r\n\r\n40.          בכל מקרה של אבדן או גניבה של מכשירך או בכל מקרה בו קיים חשש לשימוש לרעה במכשיר, יש לפנות למוקד התמיכה של MAX (בטלפון שמספרו 1-700-70-3232) לצורך חסימת השימוש באפליקציה ובשירותים באמצעות המכשיר.\r\n41.          חברת MAX אחראית לאספקת שירותי תחזוקה ותמיכה לאפליקציות אשר יסופקו בהיקף הנדרש כפי שיקול דעתה של חברת MAX מעת לעת, ובכפוף לכל דין. ל-Appleו/או Google ו/או כל חברה אחרת שתאפשר הורדה של האפליקציות של MAX בעתיד אין כל אחריות שהיא לאספקת שירותי תחזוקה ותמיכה לאפליקציות.\r\n42.          חברתMAX אינה אחראית לכל נזק, פגם, או תקלה מכל מין וסוג שהם, העלולים להיגרם עקב הורדת (download) ו/או התקנת האפליקציות, לרבות ומבלי לגרוע מכלליות האמור, אובדן נתונים, פגמים ו/או תקלות במכשיר ו/או בחומרה ו/או בתוכנה אחרת כלשהן (\"נזקים\"). למרות האמור לעיל, חברת MAX לא תהיה פטורה מאחריות ככל שזו חלה עליה על-פי דין. ידוע לך, כי על מנת לצמצם ככל הניתן נזקים, עליך לבצע מפעם לפעם גיבויים, לרבות לפני הורדת ו/או התקנת כל גרסה של האפליקציות.\r\n43.          מבלי לגרוע מהאמור לעיל, MAX ולא Apple ו- Google ו/או כל חברה אחרת שתאפשר הורדה של אפליקציות MAX בעתיד הינה הכתובת לכל טענה שלך או של צד שלישי כלשהו הקשורה לאפליקציות או להחזקתן על ידיך ו/או לשימוש באפליקציות, לרבות ומבלי לגרוע מהאמור:\r\n43.1       טענה בגין אחריות למוצרים;\r\n43.2       כל טענה לפיה האפליקציה, אינה עומדת בדרישות הדין או דרישות רשויות מוסמכות;\r\n43.3       טענות העולות מכוח חוקי הגנת הצרכן;\r\n43.4       תביעה של צד שלישי כלשהו לפיה האפליקציה או החזקתה או השימוש בה על ידי מהווים הפרה של זכויות הקניין הרוחני של אותו צד שלישי.\r\nלהסרת ספק, יובהר כי אין באמור לעיל כשלעצמו כדי להטיל אחריות כלשהי על MAX.\r\n\r\n44.          השימוש באפליקציות מותנה בכך ש:\r\n44.1       אינך נמצא במדינה הכפופה לאמברגו ממשלתי של ארה\"ב או שהוגדרה על ידי ממשל ארה\"ב כמדינת \"התומכת בטרור\" ו -\r\n44.2       אינך מופיע/ה בשום רשימה שהיא של ממשל ארה\"ב ביחס לגופים ו/או אישים אסורים או מוגבלים ו-\r\n44.3       אינך נמצא במדינה אשר הורדת האפליקציה, התקנתה ו/או השימוש בה אסורים.\r\n45.          תנאי שימוש אלה מהווים חוזה לטובת צד שלישי ביחס לחברת Apple ו-Google ו/או כל חברה אחרת שתאפשר הורדה של האפליקציות של MAX בעתיד וחברות הבנות שלהן. הסכמתך לאמור בתנאי השימוש תקנה ל-Apple ו-Google ו/או כל חברה אחרת שתאפשר הורדה של האפליקציות בעתיד את הזכות (ו-Apple ו-Google ו/או כל חברה אחרת שתאפשר הורדה של האפליקציות בעתיד תחשב כמי שקיבלה על עצמה את הזכות) לאכוף את זכויותיה על-פי תנאי שימוש אלה כלפיך, בהיותה צד שלישי מוטב על פיהם.\r\n46.          הרשאות לאישור באפליקציה\r\nמבלי לגרוע מהאמור בפרק ח' להלן, השימוש באפליקציות MAX דורש מתן ההרשאות הבאות:\r\n\r\n46.1       גישה למצלמת המכשיר -על-מנת שהמשתמש יוכל לצלם תמונת פרופיל.\r\n46.2       הרשאה לקבלת \"התראות בדחיפה\" (Push Notifications) ולשירותי המיקום במכשיר - על-מנת שהמשתמש יוכל לקבלת התראות הקשורות לעדכונים חשובים, התראות פעילות בחשבון, ולצרכי מניעת הונאה, ובכפוף להסכמת המשתמש, כדי להציע לו מוצרים או שירותים שונים שעשוי להיות לך עניין בהם, מעת לעת, על בסיס העדפותיו ו/או שימושיו בכרטיסו/יו או באפליקציות (לרבות מיקום המכשיר בעת השימוש באפליקציות), לפי כל דין ובהתאם להוראות פרק ח' להלן.\r\n46.3       גישה לרשימת אנשי הקשר (\"ספר הטלפונים\") -על-מנת שהמשתמש יוכל לבחור מרשימת אנשי הקשר במכשירו את אנשי הקשר שהוא רוצה להעביר אליהם כספים באמצעות האפליקציות.\r\n46.4       גישה לגלריית התמונות ולהתקני אחסון וזיכרון במכשיר - ככל שהמשתמש יבקש לשמור צילומי מסך של פעולות או ממסכי האפליקציות, על-מנת שהמשתמש יוכל לבחור מגלריית התמונות תמונות לתמונת פרופיל וכן הלאה.\r\n46.5       הרשאה לחיבור המכשיר לרשת האינטרנט (לרבות לרשת WIFI) - על-מנת שהמשתמש יוכל לעשות שימוש באפליקציות (ללא חיבור לרשת, לא ניתן להשתמש באפליקציות).\r\n46.6       הרשאה לרכיב ה-NFC במכשיר (במכשירים תומכים מבוססי מערכת הפעלה אנדרואיד) - על-מנת לעשות שימוש בשירותים הניתנים באמצעות האפליקציות כגון תשלום באמצעות המכשיר הנייד.\r\n46.7       הרשאה לרכיב טביעת האצבע / זיהוי הפנים במכשיר - על-מנת שהמשתמש יוכל להזדהות במהירות בכניסה לאפליקציות, באמצעות טביעת אצבע או זיהוי פניו.\r\n46.8       גישה לקריאת מסרונים (SMS) -לצרכי אבטחת מידע, זיהוי ואימות פרטים, ועבור קריאת קוד הסמס שנשלח למכשיר באופן אוטומטי.\r\n46.9       גישה לנתוני זיהוי מכשיר (Device ID) - עבור יצירת מזהה ייחודי ברישום לשירותים השונים, ולצרכי זיהוי, אימות ובדיקות אבטחה.\r\nח. קישורים לאתרים חיצוניים\r\n \r\n\r\n47.          ייתכן וחלק מהשירותים יכילו קישורים (Hyperlinks) לאתרים אחרים, לרבות קישורים שנעשו על ידי גורמים המבצעים פרסום באמצעות השירותים. קישורים אלה נועדו לנוחיותך בלבד. השימוש במידע או בתכנים אחרים הנמצאים באתרים החיצוניים אליהם מוביל הקישור טעון זהירות ובדיקה קפדניים. מובהר כי, ל-MAX אין כל שליטה או זכות על התכנים הנמצאים באתרים חיצוניים אלה. כמו כן, חברתMAX אינה נושאת בכל אחריות במקרה בו הסתמכת ו/או ביצעת פעולות בהתאם לנמצא באתרים חיצוניים אלה. אין לפרש את הקישורים הנמצאים בשירותים כהמלצה, העדפה או אישור להשתמש בחומר ו/או התכנים ו/או המוצרים המופיעים באתרים החיצוניים. כמו כן, אין לפרש קישורים אלה כערובה למהימנות, לדיוק או לשלמות המידע המצוי בהם.\r\n48.          במידה ומצאת במידע הנמצא בשירותים, או במידע הקיים בין תכניו של כל שירות אחר המקושר ממנו, חומר הנחזה כלא תקין, לא חוקי, לא מוסרי או שאינו עומד בציפיות המשתמש, אתה מתבקש להודיע על כך למנהלי השירותים באמצעות שירות הלקוחות של MAX בטלפון\r\n03-6178888.\r\nט. הודעות ועדכונים\r\n \r\n\r\n49.          הודעות ועדכונים באשר לשירותים המוענקים באמצעות השירותים, לרבות דואר פרסומי, יכול ויישלחו אליך באמצעות מערכת הדואר האלקטרוני, או באמצעות דואר רגיל או באמצעות הודעות SMS או באמצעות פקסימיליה או באמצעות מערכת חיוג אוטומאטית, או בכל אמצעי תקשורת אחר לכתובת אותה ציינת בטופס הרישום לשירותים, או שנמסרה לנו במסגרת מתן השירות הנוכחי, או במסגרת ההסכם עליו הינך חתום מול MAX.\r\nשים/י לב: אם הנך רשום/ה לקבלת שירות מידע ב-SMS, ותבחר להירשם לשירות הודעות באמצעות האפליקציות של MAX, לא נשלח לך הודעות SMS בגין הודעות שתשלחנה לך באמצעות האפליקציות.\r\n\r\nי. גיל ואחריות כללית\r\n \r\n\r\n50.          הינך מצהיר כי הינך כשיר משפטית למתן התחייבויותיך על פי תנאי הש הזמנה. \r\n\r\n4. שוברי מתנה (Gift Card)\r\n\r\n4.1 החברה מאפשרת רכישת שוברים אלקטרוניים (להלן: \"שובר מתנה\") בסכומים כפי שמופיעים באתר.\r\n\r\n4.2. תוקף שובר המתנה הינו ל- 5 שנים. הארכת תוקף שובר תתבצע בכפוף להוראות הדין, באמצעות פניה לשירות הלקוחות של החברה.\r\n\r\n4.3 שובר המתנה יישלח לנמען באמצעות הודעת SMS, דואר אלקטרוני, או אחד מהם בלבד, לפי בחירת הרוכש במעמד ההזמנה.\r\n\r\n4.4 מובהר, כי האחריות המלאה להזנת פרטי הנמען (שם, מספר טלפון וכתובת דוא\"ל) חלה על הרוכש בלבד. החברה לא תישא באחריות לטעות בפרטים שנמסרו בעת הרכישה, לרבות מסירת שגויה או חסרה של פרטי התקשרות.\r\n\r\n4.5 החיוב בשובר המתנה הוא מיידי כנגד היתרה הצבורה. שובר מתנה אינו ניתן להמרה, לפירעון במזומן או לטעינה חוזרת. מרגע שהונפק, לא ניתן להוסיף סכום נוסף לשובר קיים.\r\n\r\n4.6 שובר המתנה ניתן למימוש הן באתר החברה והן בחנויות הרשת, בהתאם לאפשרויות הזמינות באתר. לבירור ניתן לפנות לשירות הלקוחות\r\n\r\n4.7 החברה אינה אחראית בגין שימוש שנעשה בשובר לאחר שנשלח לנמען בהתאם לפרטים שנמסרו על ידי הרוכש.\r\n\r\n4.8 במקרה של גניבה ו/או אובדן, תפעל החברה לשחזר את היתרה הצבורה בשובר לבקשת מי שנחזה בעיניה כמי שהחזיק כדין בשובר, למעט במקרים שבהם אין ביכולתה, במאמצים סבירים, לזהות את השובר של אותו מבקש לצורך שחזור היתרה כאמור, ובלבד שקיימת יתרה צבורה בשובר במועד הפניה, והכל בכפוף להוראות הדין.\r\n\r\n4.9. ביטול עסקה לרכישת שובר מתנה הינה בהתאם להוראות חוק הגנת הצרכן, כמפורט בסעיף 6 להלן, ובכפוף לכך שלא נעשה שימוש בשובר. למען הסר ספק, במקרה של ביטול עסקה לרכישת שובר מתנה, התמורה ששולמה עבור השובר תוחזר, בניכוי דמי ביטול (ככל שישנם), לאמצעי התשלום באמצעותו בוצע התשלום עבור השובר.\r\n\r\n\r\n5. אספקת המוצרים\r\n5.1. המוצרים שנתקבלה בגינם הודעת האישור יסופקו ישירות לכתובת אותה ימסור המשתמש על ידי חברת שילוח חיצונית (להלן: \"חברת השילוח\") עד חמישה ימי עסקים ממועד קבלת הודעת האישור.\r\n\r\n5.2 ככל ופריט אשר מופיע באתר אזל מהמלאי והדבר התברר לחברה לאחר ביצוע ההזמנה, החברה תעדכן את הלקוח (באמצעות טלפון או דואר אלקטרוני) ותבצע ביטול עסקה חלקי או מלא (בהתאם לחוסר). כמו כן, במקרה ונפלה טעות באחד מפרטי ההזמנה ו/או במקרה של טעות טכנית ו/או במקרה של טעות בהזנת נתוני המוצרים, החברה שומרת לעצמה את הזכות לבטל את ההזמנה.\r\n5.3. ככלל, ניתן לבצע הזמנה באתר לכל אזורי הארץ, למעט אזור הערבה והעיר אילת וכן יהודה ושומרון ואזורים הנמצאים מחוץ לשטחי ישראל. עם זאת, האפשרות להזמין מוצרים באתר מוגבלת לאזורים בהתאם למפת אזורי החלוקה של חברת השילוח. החברה רשאית, אך לא מתחייבת, לספק את המוצרים גם אל מחוץ לאזורי החלוקה, בתיאום טלפוני מראש. במקרה זה, גם אם ההזמנה התקבלה ונקלטה בשרתי האתר, לא תהיה חייבת החברה לספקה. במידה והמשתמש מתגורר באזורים המוגבלים לגישה מבחינה ביטחונית, חברת השילוח תתאם עימו מראש מקום איסוף סמוך. \r\n5.4. החברה אינה אחראית על זמני המשלוח ועיכובים של חברת השילוח, אך עומדת לרשות המשתמש על מנת לפתור כל בעיה. החברה אינה אחראית לעיכובים באספקת המוצרים כתוצאה מאירועים שאינם בשליטתה, כדוגמת תקלות, עיכובים, שביתות, אסונות טבע, תקלות במערכת המחשוב או במערכות הטלפונים שיפגעו בהשלמת תהליך הרכישה או תקלות בשירות הדואר האלקטרוני.\r\n5.5. החברה ו/או מי מטעמה לא יהיו אחראים ולא יישאו בכל נזק ישיר, עקיף, תוצאתי או אחר שייגרם למשתמש ו/או למי מטעמו ו/או לצד שלישי כתוצאה משימוש ו/או ביצוע רכישה באמצעות האתר, שלא על פי תקנון זה, תהא עילת התביעה אשר תהא, לרבות הפסד הכנסה ו/או מניעת רווח שייגרמו מכל סיבה שהיא. בכפוף להוראות דיני הגנת הצרכן ומבלי לגרוע מכל הסעדים המגיעים לה על פי תקנון זה וכל דין שומרת לעצמה החברה את הזכות לבטל הזמנה שבוצעה באתר שבמסגרתה נגרם נזק כאמור לעיל.\r\n5.6. החברה עושה כמיטב יכולתה לספק מוצרים איכותיים במועד המבוקש. אם המשתמש סבור כי המוצרים שרכש באמצעות האתר לוקים בפגם כלשהו, הוא מוזמן לפנות לשירות הלקוחות בצ'ט עם נציג אונליין הזמין כאן באתר, בתיבת צור קשר או בטלפון 0765385555 בימים א' – ה' בין השעות 9:00 – 16:00.\r\n\r\n6. ביטול עסקת הרכישה על ידי המשתמש\r\n6.1. הוראות סעיף זה כפופות להוראות חוק הגנת הצרכן, התשמ\"א-1981.\r\n6.2. המשתמש רשאי לבטל עסקה שביצע באתר בתקופה שהחל מיום הרכישה ועד 14 ימים מיום עשיית העסקה ועד 14 ימים מיום קבלת הנכס, או מיום קבלת המסמך המכיל את הפרטים האמורים בסעיף קטן (ב), לפי המאוחר מהם. \r\n7. PANDORA Club\r\nהמשתמש מוזמן להירשם למועדון הלקוחות של PANDORA (פנדורה)בכפוף לתנאי PANDORA Club. רישום ל – PANDORA Club מקנה למשתמש הטבות, לרבות עיצוב תכשיטים וקבלת מידע אודות מוצרים חדשים.\r\n8. אחריות ושיפוי\r\n8.1. החברה אינה אחראית לכל נזק ו/או הפסד ו/או אובדן רווח שנגרם למשתמש ו/או לכל צד ג' כתוצאה ישירה או עקיפה מן השימוש באתר.\r\n8.2. המשתמש מתחייב לשפות את החברה, עובדיה, מנהליה או מי מטעמה בגין כל נזק, הפסד, אבדן-רווח, תשלום או הוצאה שייגרמו להם, ובכלל זה שכ\"ט עו\"ד והוצאות משפט עקב הפרת הוראות תקנון זה, כולן או חלקן. בנוסף, יפצה ו/או ישפה המשתמש את החברה, עובדיה, מנהליה או מי מטעמה בגין כל טענה, תביעה או דרישה שתועלה נגדם על ידי צד שלישי כלשהו כתוצאה מכל שימוש אותו עשה באתר או בכל הקשור בו. \r\n9. קניין רוחני\r\n9.1. זכויות היוצרים בכל המידע המופיע באתר, לרבות התמונות, הטקסט באתר, כמו גם בעיצוב האתר, בכל יישומי התוכנה שבו וכל מודול אחר הקשור עם האתר (להלן ביחד: \"המידע המוגן\") הינם קניינה של החברה ו/או PANDORA A/S בלבד, והכל אלא אם נקבע מפורשות, כי הם שייכים לאחר.\r\n9.2. הסימנים המסחריים המוצגים באתר זה (להלן: \"סימני המסחר\") שייכים לחברה ו/או ל- PANDORA A/S (בין אם נרשמו ובין אם לאו) וחל איסור לעשות בהם שימוש לכל מטרה שהיא, ללא הסכמה מראש ובכתב של החברה.\r\n9.3. המשתמש מתחייב לא לעשות כל שימוש בזכויות השייכות לחברה ו/או ל- PANDORA A/S ו/או לצד ג' כלשהו, לרבות זכויות יוצרים וסימני המסחר הנחשפים במהלך השימוש והגלישה באתר.\r\n9.4. אין להעתיק, להפיץ, לפרסם, למכור, לשכפל, לשדר, לצלם או לשנות את המידע המופיע באתר או חלק ממנו, ללא הסכמה מראש ובכתב של החברה. בכלל זה אין לאסוף נתונים מן האתר באמצעות תוכנות ו/או להפיץ נתונים כאלה ברבים באופן מסחרי או במסגרת מסחרית. ההוראה חלה בין אם המידע או חלקו הינם בבעלות החברה ובין אם בבעלות צד שלישי, למעט במקרים של הורדה (download) לשימוש אישי ולא מסחרי.\r\n9.5. בכדי לקשר ו/או להציג את האתר באתרים אחרים על גבי רשת האינטרנט, כך שהאתר יהיה \"אתר מקושר\" יש לקבל מהחברה אישור מראש ובכתב. \r\n\r\n10. דין וסמכות שיפוט\r\nהדין החל על תקנון זה ו/או על כל פעולה ו/או על סכסוך הנובע ממנו, הוא הדין הישראלי בלבד. הסמכות הבלעדית לדון בכל מחלוקת הנובעת, במישרין או בעקיפין, מהוראות תקנון זה ו/או מהשימוש ו/או מרכישות באתר – תהא לבתי המשפט בתל אביב-יפו.\r\n11. שינויים באתר וזמינותו\r\n11.1. החברה רשאית, לפי שיקול דעתה הבלעדי, לשנות מעת לעת את מבנה האתר, מראהו ועיצובו, וכן כל היבט אחר הכרוך באתר, והכל בלא צורך להודיע על כך למשתמש מראש. מובהר, כי לא תעמוד למשתמש כל טענה, תביעה ו/או דרישה כלפי החברה בגין ביצוע שינויים כאמור ו/או תקלות שיתרחשו אגב ביצועם.\r\n11.2. מבלי לגרוע מן האמור לעיל, מובהר, כי החברה רשאית להסיר את האתר מרשת האינטרנט ו/או לחסום את הגישה אליו, כולו או חלקו. הורדה ו/או חסימה כאמור יכול שתלווה במחיקת מלוא או חלק מהמידע האצור בו.\r\n11.3. החברה אינה מתחייבת לשמור על זמינות האתר ו/או זמינות תכני האתר. מובהר, כי האתר ותכניו אינם חסינים מפני גישה בלתי מורשית למחשבי החברה או מפני נזקים, קלקולים, תקנות או כשלים, בין בחומרה, בין בתוכנה, בין בקווי ובמערכות תקשורת, בין אצל החברה ובין אצל מי מספקיה ולא יהא באלה כדי להטיל על החברה אחריות כלשהי ו/או להקים זכות למי מהמשתמשים כלפי החברה ו/או מי מטעמה.\r\n12. אתרים סלולריים \r\n12.1. כל תנאי השימוש המנויים לעיל, נכונים גם לאתר בתצורתו הסלולרית.\r\n12.2. השירות זמין במכשירים תומכי אינטרנט סלולרי. השירות ניתן בעלות גלישה סלולרית לפי תעריפי המפעילים. לפרטים ועזרה ניתן לפנות למוקד התמיכה/אינטרנט סלולרי של המפעיל הסלולרי.  \r\nלתשומת הלב- התצוגה עשויה להיות שונה בהתאם לסוג המכשיר.\r\n12.3. העברת התכנים באמצעות רשת האינטרנט ו/או הרשת הסלולרית, כפופה בין השאר למגבלות הכיסוי הסלולרי ורשת האינטרנט. המשתמש מודע לאופי פעולות רשתות אלו שאינן בשליטת החברה, לאופי הקשר הסלולרי, לניתוקי השיחות שהינם במסגרת הנורמה הנוהגת לגבי תקשורת סלולרי, ולעובדה שבחלק מן האזורים בארץ יתכן שהכיסוי של התקשורת הסלולרית אינו מלא או רציף, ועל כן יכולים לקרות שיבושים בזמנים, או שיבושים בתכנים הנגרמים בשל רשתות אלו. שיבושים אלו אינם באחריות החברה, והמשתמש פוטר את החברה מכל טענה בעניין זה. \r\n\r\nאבטחת מידע ושמירה על פרטיות:\r\n1.1. הסכמת המשתמש:\r\n1.1.1. החברה, City Time I.L LTD, מפעילת האתר, מכבדת את לקוחותיה ואת המשתמשים באתר המופעל על ידה ובבעלותה, שכתובתו: https://www.pandora-shop.co.il/, וכן את המשתמשים בשירותים השונים המוצעים במסגרתו.\r\n1.1.2.
